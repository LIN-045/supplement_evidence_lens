x-python-service: &python-service
  image: supplement-evidence-lens:latest

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  indexer:
    <<: *python-service
    command: python -m ingestion.index_documents
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      HF_HOME: /models/huggingface
    volumes:
      - model_cache:/models
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  app:
    <<: *python-service
    build:
      context: .
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HF_HOME: /models/huggingface
      MONITORING_DATABASE_PATH: /monitoring/interactions.db
    ports:
      - "8501:8501"
    volumes:
      - model_cache:/models
      - ./data/monitoring:/monitoring
    depends_on:
      indexer:
        condition: service_completed_successfully
    restart: unless-stopped

  monitoring:
    <<: *python-service
    command:
      [
        "streamlit",
        "run",
        "monitoring/dashboard.py",
        "--server.address=0.0.0.0",
        "--server.port=8502",
      ]
    environment:
      MONITORING_DATABASE_PATH: /monitoring/interactions.db
    ports:
      - "8502:8502"
    volumes:
      - ./data/monitoring:/monitoring
    restart: unless-stopped

volumes:
  elasticsearch_data:
  model_cache:
