[project]
name = "supplement-evidence-lens"
version = "0.1.0"
description = "Evidence-grounded dietary supplement Q&A with agentic RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=9.4.1",
    "openai>=2.49.0",
    "pandas>=2.3.3",
    "prefect>=3.8.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
